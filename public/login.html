<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achievers FC - Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="auth-page">
  <div class="auth-shell">
    <main class="auth-main">
      <section class="panel">
        <div class="page-title">
          <h2>Log In</h2>
          <p>Access your dashboard securely.</p>
        </div>
        <form id="login-form" class="form-grid" style="margin-top: 16px;">
          <label class="form-field">
            <span>Email</span>
            <input class="input" type="email" name="email" autocomplete="email" required />
          </label>
          <label class="form-field">
            <span>Password</span>
            <input class="input" type="password" name="password" autocomplete="current-password" required />
          </label>
          <div class="form-error" id="login-error" role="alert"></div>
          <div class="actions">
            <button class="action-btn" id="login-submit" type="submit">Log in</button>
            <a class="ghost-btn" href="/forgot-password.html">Forgot password</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
