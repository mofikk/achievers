<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achievers Activity Monitor - Visitors Obligations</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Achievers Activity Monitor</div>
      <div id="sidebar-slot"></div>
    </aside>
    <div class="nav-overlay hidden" id="nav-overlay"></div>
    <div class="content">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <span class="hamburger" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
        <h1>Achievers Activity Monitor</h1>
      </header>
      <main class="main">
        <div class="page-title">
          <div class="page-title-row">
            <div>
              <h2>Visitors Obligations</h2>
              <p>Play fees and card fines.</p>
            </div>
            <div class="page-title-actions horizontal-filter-actions">
              <label class="form-field">
                <span>Year</span>
                <select class="input" id="visitor-obligation-year"></select>
              </label>
              <label class="form-field">
                <span>Month</span>
                <select class="input" id="visitor-obligation-month"></select>
              </label>
              <div class="horizontal-filter-search">
                <input class="input" id="visitors-search" type="search" placeholder="Search name or nickname..." />
                <span id="visitors-count" class="muted"></span>
              </div>
            </div>
          </div>
        </div>

        <section class="panel sticky-table-panel">
          <div class="table-wrap sticky-table-wrap">
            <table class="table responsive sticky-data-table visitor-obligations-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Nickname</th>
                  <th>Play Fee Owed</th>
                  <th>Fines Owed</th>
                  <th>Total Owed</th>
                  <th class="sortable" data-key="status">Status</th>
                </tr>
              </thead>
              <tbody id="visitors-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/sidebar-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/visitors-obligations.js"></script>
</body>

</html>
