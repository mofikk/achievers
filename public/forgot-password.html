<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achievers FC - Reset Password</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <main class="auth-main">
      <section class="panel">
        <div class="page-title">
          <h2>Reset Password</h2>
          <p>Enter your email to receive a password reset link.</p>
        </div>
        <form id="forgot-form" class="form-grid" style="margin-top: 16px;">
          <label class="form-field">
            <span>Email</span>
            <input class="input" type="email" name="email" autocomplete="email" required />
          </label>
          <div class="form-error" id="forgot-error" role="alert"></div>
          <div class="actions">
            <button class="action-btn" id="forgot-submit" type="submit">Send reset link</button>
            <a class="ghost-btn" href="/login.html">Back to login</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
