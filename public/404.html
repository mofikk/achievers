<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achievers Activity Monitor - Page Not Found</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="system-page">
  <main class="system-shell">
    <section class="panel system-panel">
      <div class="system-code">404</div>
      <div class="page-title">
        <h2>Page Not Found</h2>
        <p>The page you are looking for does not exist or may have been moved.</p>
      </div>
      <div class="actions system-actions">
        <a class="action-btn" href="/index.html">Go to Dashboard</a>
        <a class="ghost-btn" href="/login.html">Go to Login</a>
      </div>
    </section>
  </main>
</body>

</html>
