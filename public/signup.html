<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achievers FC - Sign Up</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="content" style="min-height: 100vh;">
    <header class="topbar">
      <h1>Achievers FC</h1>
    </header>
    <main class="main" style="max-width: 560px; width: 100%; margin: 0 auto;">
      <section class="panel">
        <div class="page-title">
          <h2>Create Account</h2>
          <p>Sign up to start using the app.</p>
        </div>
        <form id="signup-form" class="form-grid" style="margin-top: 16px;">
          <label class="form-field">
            <span>Email</span>
            <input class="input" type="email" name="email" autocomplete="email" required />
          </label>
          <label class="form-field">
            <span>Password</span>
            <input class="input" type="password" name="password" autocomplete="new-password" required />
          </label>
          <label class="form-field">
            <span>Confirm Password</span>
            <input class="input" type="password" name="confirmPassword" autocomplete="new-password" required />
          </label>
          <div class="form-error" id="signup-error" role="alert"></div>
          <div class="actions">
            <button class="action-btn" id="signup-submit" type="submit">Create account</button>
            <a class="ghost-btn" href="/login.html">Back to login</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
